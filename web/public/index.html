  if (e.target.matches?.("[data-cfsearch]")) { const q = e.target.value.toLowerCase(); e.target.closest(".cf-sec").querySelectorAll("[data-cflabel]").forEach(l=>l.hidden = !l.dataset.cflabel.includes(q)); return; }
  if (e.target.dataset?.fq) { S.filters[e.target.dataset.fq] = e.target.value; clearTimeout(S.qt); S.qt = setTimeout(render, 200); return; }
  if (e.target.dataset?.tq) { tf(e.target.dataset.tq).q = e.target.value; clearTimeout(S.qt); S.qt = setTimeout(render, 200); return; }
  const id = e.target.id, map = { fq:"q", umQ:"umQ", actQ:"actQ" };
  if (map[id]) { S.filters[map[id]] = e.target.value; clearTimeout(S.qt); S.qt = setTimeout(render, 200); }
});
document.addEventListener("change", (e) => {
  const fs = e.target.closest("[data-fs]"); if (fs) { S.filters[fs.dataset.fs] = fs.value; return render(); }
  const pc = e.target.closest("[data-perm]"); if (pc) { const k = pc.dataset.perm, defs = roleDefaults(S.permEdit.role); if (pc.checked===defs[k]) delete S.permEdit.perms[k]; else S.permEdit.perms[k] = pc.checked; const y = window.scrollY; render(); window.scrollTo(0,y); return; }
  const pl = e.target.closest("[data-perm-lead]"); if (pl) { S.permEdit.leadId = pl.value; return render(); }
  const rd = e.target.closest("[data-rdef]"); if (rd) { const [r,k] = rd.dataset.rdef.split("|"); S.rdDraft[r][k] = rd.checked; const y = window.scrollY; render(); window.scrollTo(0,y); return; }
  if (e.target.id==="impFile" && e.target.files?.[0]) { const f = e.target.files[0]; e.target.value = ""; return importUpload(f); }
  const ct = e.target.closest("[data-cat]"); if (ct) { const [i,k] = ct.dataset.cat.split("|"); S.kpiDraftCats[+i][k] = k==="active" ? ct.checked : ct.value; return; }
  const cfm = e.target.closest("[data-cfm]"); if (cfm) { const [k,field,v] = cfm.dataset.cfm.split("|"); const f = tf(k), arr = f[field]||[]; f[field] = cfm.checked ? [...new Set([...arr, v])] : arr.filter(x=>x!==v); return render(); }
  const cfr = e.target.closest("[data-cfr]"); if (cfr) { const [k,field,v] = cfr.dataset.cfr.split("|"); tf(k)[field] = v; return render(); }
  const cft = e.target.closest("[data-cft]"); if (cft) { const [k,field] = cft.dataset.cft.split("|"); tf(k)[field] = cft.checked; return render(); }
  const tfs = e.target.closest("[data-tfs]"); if (tfs) { const [k,field] = tfs.dataset.tfs.split("|"); tf(k)[field] = tfs.value; return render(); }
  const tfa = e.target.closest("[data-tfadd]"); if (tfa && tfa.value) { const [k,field] = tfa.dataset.tfadd.split("|"); const f = tf(k); f[field] = [...new Set([...(f[field]||[]), tfa.value])]; return render(); }
  const km = e.target.closest("[data-kpi-month]"); if (km) { S.filters.kpiMonth = km.value; return render(); }
  const ss = e.target.closest("[data-status-sel]"); if (ss) { const t = S.tasks.get(S.open), v = ss.value; renderSheet(); return setStatus(t, v); }
});
$("#hsearch").addEventListener("submit", (e) => { e.preventDefault(); const q = $("#hq").value.trim(); Object.assign(S.filters, { view:"team", status:"" }); (S.tf ||= {}).tasks = { q }; $("#hq").blur(); if (location.hash==="#tasks") render(); else location.hash = "tasks"; });
document.addEventListener("keydown", (e) => {
  if (e.key==="Escape") { if ($("#menuHost").innerHTML) return closeMenu(); if (S.tfOpen) { S.tfOpen = null; return render(); } if (S.colOpen) { const a = S.colOpen; S.colOpen = null; render(); [...document.querySelectorAll(`[data-colf="${a.key}|${a.col}"]`)].find(x=>x.offsetParent)?.focus(); return; } const m = $("#modals").lastElementChild; if (m) { m.remove(); return; } if (S.bellOpen||S.userOpen) { S.bellOpen = S.userOpen = false; renderBell(); renderUserMenu(); return; } if (S.open) { S.open = null; $("#layer").innerHTML = ""; return; } $("#rail").classList.remove("open"); $("#scrim").classList.remove("open"); }
  if (e.key==="/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) && !$("#modals").children.length) { e.preventDefault(); $("#hq").focus(); }
  if ((e.key==="n"||e.key==="N") && !e.metaKey && !e.ctrlKey && !e.altKey && S.portal && can("create") && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) && !$("#modals").children.length && !S.open) { e.preventDefault(); location.hash = "new"; }
});
async function saveConfig(patch, msg){ try { await S.db.doc("config/main").set({ ...S.config, ...patch }); Object.assign(S.config, patch); toast(msg); render(); } catch { toast("Only an Admin can change settings.","error"); } }
async function saveSettings(btn){
  const channels = [...new Set($("#sChannels").value.split(",").map(s=>s.trim()).filter(Boolean))];
  const dueDays = parseInt($("#sDue").value,10), followDays = parseInt($("#sFollow").value,10);
  if (!channels.length) return toast("Keep at least one channel.","error");
  if (!(dueDays>=0 && dueDays<=30) || !(followDays>=0 && followDays<=30)) return toast("Windows must be between 0 and 30 days.","error");
  btn.classList.add("loading"); await saveConfig({ channels, dueDays, followDays }, "Settings saved"); btn.classList.remove("loading");
}
function routeTo(v){
  if (v==="team"||v==="invitations") { if (v==="invitations") S.filters.umTab = "invites"; v = "users"; }
  const home = PORTALS[S.portal||"user"].home;
  if (!v || v==="home") v = home;
  if (S.portal && (!portalViews(S.portal).has(v) || !viewOk(v))) v = home;
  if (!viewOk(v)) v = S.portal==='admin' ? 'overview' : v;
  return v;
}
window.addEventListener("scroll", () => { if (S.colOpen) placeColPop(); }, { passive:true });
window.addEventListener("resize", () => { if (S.colOpen) placeColPop(); });
window.addEventListener("hashchange", () => { S.colOpen = null; if (!S.portal) return; const v = routeTo((location.hash||"").slice(1)); S.view = v; if (location.hash !== "#"+v) history.replaceState(null, "", "#"+v); if (S.view!=="projects") S.filters.project = ""; S.open = S.openAfter || null; S.openAfter = null; $("#layer").innerHTML = ""; render(); window.scrollTo(0,0); $("#view").focus({ preventScroll:true }); });

const NAV_KEY = "pcc-nav-closed";
const navClosed = () => { try { return JSON.parse(localStorage.getItem(NAV_KEY)||"[]"); } catch { return []; } };
// ---------- theme ----------
// "light" / "dark" pin the look; "system" follows the device. Saved per browser.
const THEME_KEY = "pcc-theme";
const themePref = () => { try { return localStorage.getItem(THEME_KEY) || "system"; } catch { return "system"; } };
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
function applyTheme(pref){
  if (pref === "light" || pref === "dark") document.documentElement.dataset.theme = pref; else if (STANDALONE) delete document.documentElement.dataset.theme; else if (S.hostTheme !== undefined) { if (S.hostTheme) document.documentElement.dataset.theme = S.hostTheme; else delete document.documentElement.dataset.theme; }
  const b = $("#themeBtn"); if (b) { b.innerHTML = ic(pref==="system" ? "monitor" : isDark() ? "moon" : "sun", 18); b.setAttribute("aria-label", `Theme: ${pref==="system"?"match device":pref}`); }
  document.querySelectorAll("[data-theme-set]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.themeSet===pref));
  if (renderGoogleButton.init && $("#gbtn")) renderGoogleButton();
}
function setTheme(pref){ try { localStorage.setItem(THEME_KEY, pref); } catch {} applyTheme(pref); toast(pref==="system" ? "Theme follows your device" : `${pref[0].toUpperCase()+pref.slice(1)} mode on`, "info"); }
const themeSeg = () => `<div class="seg theme-seg" role="group" aria-label="Theme">${[["light","sun","Light"],["dark","moon","Dark"],["system","monitor","Auto"]].map(([k,i,l])=>`<button type="button" data-theme-set="${k}" aria-pressed="${themePref()===k}">${ic(i,14)} ${l}</button>`).join("")}</div>`;
S.hostTheme = document.documentElement.dataset.theme;
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => applyTheme(themePref()));
applyTheme(themePref());

// ---------- boot ----------
window.__pccOnExpired = () => { if (S.portal) { clearSession(); S.me = null; S.loginStep = "who"; showLogin(); toast("Your session ended. Sign in again.","info"); } };
function skeleton(){ return `<div class="sk" style="height:56px;max-width:420px"></div><div class="stats">${"<div class='sk' style='height:118px'></div>".repeat(6)}</div><div class="sk" style="height:110px;border-radius:20px"></div><div class="sk" style="height:320px;border-radius:16px"></div>`; }
(async function boot(){
  $("#menuBtn").innerHTML = ic("menu",20); $("#hsIc").outerHTML = ic("search",17);
  S.view = "home";
  $("#view").innerHTML = skeleton(); renderShell();
  const timer = setTimeout(() => { if (!S.loaded) $("#view").innerHTML = `<section class="card">${(STANDALONE ? emptyState("alert","Can't reach the server","Check your connection and reload the page.") : emptyState("user","This page needs a signed-in claude.ai account","Open it while signed in. If you are signed in, ask the owner to share it with you."))}</section>`; }, 10000);
  const [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);
  if (!db || !user) { clearTimeout(timer); $("#view").innerHTML = `<section class="card">${emptyState("user","Sign in to claude.ai to use the Command Center","The shared task database is only available to signed-in people the owner has shared this page with.")}</section>`; return; }
  S.db = db; S.user = user;
  S.account = STANDALONE ? null : await user.id(); S.isOwner = STANDALONE ? false : await user.isOwner(); S.me = null;
  const cw = await user.can("data.write"); S.canWrite = cw !== false;
  let prof = null; if (!STANDALONE) try { prof = await user.me(); } catch {}
  S.myEmail = (prof?.email || "").toLowerCase();
  if (prof?.name) S.names[S.account] = prof.name;
  if (!STANDALONE) try { const ref = db.doc("team/"+S.account), cur = await ref.get(), d = cur.exists ? cur.data() : {}; const next = { ...d, id:S.account, joinedAt:d.joinedAt||Date.now(), displayName: prof?.name || d.displayName || "", email: S.myEmail || d.email || "" }; if (!cur.exists || next.displayName!==d.displayName || next.email!==d.email) await ref.set(next); } catch {}
  if (S.isOwner && !STANDALONE) { try { await db.doc("config/owner").set({ ownerId:S.account }); } catch {} }
  const refreshNames = async () => { const ids = people().map(p=>p.id).filter(id=>!isPlaceholder(id)); if (!ids.length) return; try { const ps = await user.profiles(ids); for (const id of ids) { if (ps[id]?.name) S.names[id] = ps[id].name; if (ps[id]?.email) S.emails[id] = ps[id].email.toLowerCase(); } } catch {} };
  const seen = new Set(); const ready = (k) => { seen.add(k); if (seen.size >= 4 && !S.loaded) { S.loaded = true; clearTimeout(timer); setTimeout(generateRecurring, 800); resumeSession(); } if (S.team.get(S.account)?.removed) { $("#view").innerHTML = `<section class="card">${emptyState("shield","Your access was removed","An Admin removed you from this workspace. Ask them if this is a mistake.")}</section>`; return; } if (S.portal) render(); else if (S.loaded) showLogin(); };
  db.collection("tasks").onSnapshot(snap => { S.tasks = new Map(snap.docs.map(d => [d.id, d.data()])); S.live = true; ready("tasks"); }, () => { S.live = false; renderShell(); });
  db.collection("team").onSnapshot(async snap => { S.team = new Map(snap.docs.map(d => [d.id, d.data()])); await refreshNames(); ready("team"); reconcileInvites(); });
  db.collection("roles").onSnapshot(snap => { S.roles = new Map(snap.docs.map(d => [d.id, d.data()])); ready("roles"); });
  db.collection("config").onSnapshot(snap => { for (const d of snap.docs) { if (d.id==="main") S.config = { ...S.config, ...d.data() }; if (d.id==="owner") S.ownerId = d.data().ownerId; } ready("config"); });
  db.collection("projects").onSnapshot(snap => { S.projects = new Map(snap.docs.map(d => [d.id, d.data()])); if (S.loaded && S.portal) render(); }, () => {});
  db.collection("recurring").onSnapshot(snap => { S.recurring = new Map(snap.docs.map(d => [d.id, d.data()])); S.recLoaded = true; if (S.loaded && S.portal) { render(); setTimeout(generateRecurring, 500); } }, () => {});
  db.collection("kpi").onSnapshot(snap => { S.kpi = new Map(snap.docs.map(d => [d.id, d.data()])); if (S.loaded && S.portal) render(); }, () => {});
  db.collection("pins").onSnapshot(snap => { S.pins = new Map(snap.docs.map(d => [d.id, d.data()])); if (S.loaded && !S.portal && $("#login") && !$("#login").hidden && !document.activeElement?.classList?.contains("pin-in")) showLogin(); }, () => {});
  db.collection("tombstones").onSnapshot(snap => { S.tombs = new Map(snap.docs.map(d => [d.id, d.data()])); if (S.loaded && S.portal && S.view==="bin") render(); }, () => {});
  db.collection("integrations").onSnapshot(snap => { S.integ = new Map(snap.docs.map(d => [d.id, d.data()])); if (S.loaded && S.portal && S.view==="import") render(); }, () => {});
  db.collection("invitations").onSnapshot(snap => { S.invites = new Map(snap.docs.map(d => [d.id, d.data()])); if (S.loaded && S.portal) render(); if (S.loaded) reconcileInvites(); }, () => {});
})();

(()=>{ let y=scrollY; addEventListener("scroll",()=>{ const f=document.getElementById("fab"); if(!f) return; const n=scrollY; if(Math.abs(n-y)<8) return; f.classList.toggle("away", n>y && n>120); y=n; },{passive:true}); })();
