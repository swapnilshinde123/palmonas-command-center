# Render Blueprint: the Palmonas Command Center web app (web/) plus a Postgres database.
# Nothing to paste: Render links the database and generates the workspace setup code.
# The Next.js version lives at the repo root; its Blueprint is docs/render-nextjs.yaml.
databases:
  - name: palmonas-db
    plan: free
    region: singapore
    databaseName: palmonas
    user: palmonas
    postgresMajorVersion: "16"

services:
  - type: web
    name: palmonas-command-center
    runtime: node
    plan: free
    region: singapore
    rootDir: web
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: palmonas-db
          property: connectionString
      # Shown under Environment in the Render dashboard; each person enters it once, when creating their PIN.
      - key: SETUP_CODE
        generateValue: true
