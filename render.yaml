# Render Blueprint: one always-on web service. The database is Neon (free tier); paste its URLs when prompted.
services:
  - type: web
    name: palmonas-ops
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npx prisma migrate deploy && npm run build && npx tsx prisma/seed.ts
    startCommand: npx next start -p $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22.23.4"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: SEED_OWNER_EMAIL
        sync: false
      - key: SEED_OWNER_NAME
        sync: false
      - key: PASSWORD_LOGIN
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: BUSINESS_TZ
        value: Asia/Kolkata
      - key: RUN_WORKER
        value: "true"
